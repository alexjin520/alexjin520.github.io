<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Embedded fNIRS acquisition system flow</title>
  <desc id="desc">Three separate lanes show a Bluetooth command entering the system, the libevent main loop coordinating device work, and the response returning to the phone.</desc>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfd"/>
      <stop offset="1" stop-color="#edf4f8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#4d687a"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#087e8b"/>
    </marker>
    <style>
      .panel {
        fill: #fff;
        stroke: #cad8e1;
        stroke-width: 2;
      }
      .box {
        fill: #fff;
        stroke: #587588;
        stroke-width: 2;
      }
      .teal-box {
        fill: #e7f6f7;
        stroke: #087e8b;
        stroke-width: 2.5;
      }
      .purple-box {
        fill: #f1edfb;
        stroke: #7057a8;
        stroke-width: 2;
      }
      .panel-label {
        font: 700 17px system-ui, -apple-system, "Segoe UI", sans-serif;
        fill: #087e8b;
        letter-spacing: 1.2px;
      }
      .title {
        font: 650 21px system-ui, -apple-system, "Segoe UI", sans-serif;
        fill: #183142;
      }
      .compact-title {
        font: 650 19px system-ui, -apple-system, "Segoe UI", sans-serif;
        fill: #183142;
      }
      .detail {
        font: 16px system-ui, -apple-system, "Segoe UI", sans-serif;
        fill: #506777;
      }
      .flow {
        fill: none;
        stroke: #4d687a;
        stroke-width: 3;
        marker-end: url(#arrow);
      }
      .teal-flow {
        fill: none;
        stroke: #087e8b;
        stroke-width: 3;
        marker-end: url(#arrow-teal);
      }
      .return-flow {
        fill: none;
        stroke: #7057a8;
        stroke-width: 3;
        stroke-dasharray: 10 7;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect width="1200" height="860" rx="28" fill="url(#canvas)"/>

  <!-- Request lane -->
  <rect class="panel" x="38" y="35" width="1124" height="250" rx="22"/>
  <text class="panel-label" x="66" y="73">1 · REQUEST ENTERS THE SYSTEM</text>

  <path class="flow" d="M290 184H340"/>
  <path class="teal-flow" d="M560 184H610"/>
  <path class="teal-flow" d="M830 184H880"/>

  <rect class="purple-box" x="70" y="122" width="220" height="124" rx="18"/>
  <text class="title" x="180" y="171" text-anchor="middle">Phone / App</text>
  <text class="detail" x="180" y="205" text-anchor="middle">sends a GATT command</text>

  <rect class="box" x="340" y="122" width="220" height="124" rx="18"/>
  <text class="title" x="450" y="171" text-anchor="middle">BlueZ GATT</text>
  <text class="detail" x="450" y="205" text-anchor="middle">decodes and validates</text>

  <rect class="teal-box" x="610" y="122" width="220" height="124" rx="18"/>
  <text class="title" x="720" y="162" text-anchor="middle">Protected queue</text>
  <text class="detail" x="720" y="194" text-anchor="middle">copies the request</text>
  <text class="detail" x="720" y="220" text-anchor="middle">eventfd wakes the loop</text>

  <rect class="teal-box" x="880" y="122" width="250" height="124" rx="18"/>
  <text class="title" x="1005" y="171" text-anchor="middle">libevent main loop</text>
  <text class="detail" x="1005" y="205" text-anchor="middle">takes ownership of work</text>

  <!-- Work lane -->
  <rect class="panel" x="38" y="310" width="1124" height="315" rx="22"/>
  <text class="panel-label" x="66" y="348">2 · THE OWNER THREAD COORDINATES DEVICE WORK</text>

  <path class="teal-flow" d="M600 463V493H225V520"/>
  <path class="teal-flow" d="M600 463V520"/>
  <path class="teal-flow" d="M600 493H975V520"/>

  <rect class="teal-box" x="400" y="385" width="400" height="78" rx="18"/>
  <text class="title" x="600" y="417" text-anchor="middle">State-owning main thread</text>
  <text class="detail" x="600" y="445" text-anchor="middle">short callbacks · serialized shared state</text>

  <rect class="box" x="75" y="520" width="300" height="72" rx="16"/>
  <text class="compact-title" x="225" y="550" text-anchor="middle">Sampling state machine</text>
  <text class="detail" x="225" y="577" text-anchor="middle">timer-driven phases</text>

  <rect class="purple-box" x="450" y="520" width="300" height="72" rx="16"/>
  <text class="compact-title" x="600" y="550" text-anchor="middle">CAN measurement nodes</text>
  <text class="detail" x="600" y="577" text-anchor="middle">commands and frame responses</text>

  <rect class="box" x="825" y="520" width="300" height="72" rx="16"/>
  <text class="compact-title" x="975" y="550" text-anchor="middle">UART peripherals</text>
  <text class="detail" x="975" y="577" text-anchor="middle">non-blocking device I/O</text>

  <!-- Response lane -->
  <rect class="panel" x="38" y="650" width="1124" height="175" rx="22"/>
  <text class="panel-label" x="66" y="688">3 · THE RESULT RETURNS ON A SEPARATE PATH</text>

  <path class="return-flow" d="M890 763H830"/>
  <path class="return-flow" d="M610 763H550"/>
  <path class="return-flow" d="M330 763H270"/>

  <rect class="teal-box" x="890" y="718" width="240" height="90" rx="16"/>
  <text class="title" x="1010" y="754" text-anchor="middle">Main-thread result</text>
  <text class="detail" x="1010" y="782" text-anchor="middle">status + payload</text>

  <rect class="purple-box" x="610" y="718" width="220" height="90" rx="16"/>
  <text class="title" x="720" y="754" text-anchor="middle">socketpair</text>
  <text class="detail" x="720" y="782" text-anchor="middle">bounded response</text>

  <rect class="box" x="330" y="718" width="220" height="90" rx="16"/>
  <text class="title" x="440" y="754" text-anchor="middle">GATT response</text>
  <text class="detail" x="440" y="782" text-anchor="middle">encodes the reply</text>

  <rect class="purple-box" x="70" y="718" width="200" height="90" rx="16"/>
  <text class="title" x="170" y="754" text-anchor="middle">Phone / App</text>
  <text class="detail" x="170" y="782" text-anchor="middle">receives the result</text>
</svg>
